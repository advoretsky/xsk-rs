[package]
name = "xsk-rs"
version = "0.8.0"
authors = ["Douglas Gray <dbgray01@gmail.com>"]
edition = "2024"
description = "Rust bindings for Linux AF_XDP sockets"
license = "MIT"
repository = "https://github.com/DouglasGray/xsk-rs"
readme = "README.md"
keywords = ["AF_XDP", "XSK", "eBPF", "XDP"]

[dependencies]
bitflags = "2.9.0"
cfg-if = "1.0.0"
libc = "0.2.171"
# `use_cc_build` opts into the CC-based build of libxdp-sys 0.2.4+. The
# default Make-based build (the upstream default after libxdp-sys PR #15
# reverted #13) doesn't honor cargo's target-arch env when cross-compiling,
# so aarch64 builds end up with x86_64 ELF objects in the rlib and the
# final link fails. PR #13 (which 0.2.3 carried as default) lives on as
# this feature in 0.2.4. crouter's CI cross-compiles to aarch64; without
# this we'd be stuck on the yanked 0.2.3.
libxdp-sys = { version = "0.2.4", features = ["use_cc_build"] }
log = "0.4.27"

[dev-dependencies]
anyhow = "1.0.97"
crossbeam-channel = "0.5.15"
ctrlc = "3.4.6"
env_logger = "0.11.8"
etherparse = "0.19.0"
futures = "0.3.31"
rand = "0.9.0"
rtnetlink = "0.18.0"
serial_test = "3.2.0"
structopt = "0.3.26"

[dev-dependencies.tokio]
version = "1.44.2"
default-features = false
features =  ["rt-multi-thread", "macros", "sync", "signal", "time"]
